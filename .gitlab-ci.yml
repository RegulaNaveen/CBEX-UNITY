workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"' # Disable pipeline for Merge requests 

include:
  - local: devops/vars/global.yml

stages:
  - initialize  #To initialize with environment specific paramters/variables
  - sonar #sonar report
  - build  #builds the artifacts
  - deploystack #deploys the CF stack (if DeployStack to true in global.yml file) which includes S3, cloudfornt, route53
  - deployartifacts #deploys only the artifacts to s3 and invalidate the cloudfront
  
initialize:
  stage: initialize
  only:
    - qa
    - uat
    - master
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest  
  script:
    - bash devops/scripts/set_env.sh #this script will be executed to set the environment deploying to as environment variable and make it available to other below jobs
    - source build.env
    - cat devops/vars/${Environment}.env >> build.env #set the environment specific variables/parameters
  artifacts:
    paths:
      - build.env
  tags:
    - docker

dev_initialize:
  stage: initialize
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest  
  only:
    - dev
    - migration
  script:
    - bash devops/scripts/set_env.sh #this script will be executed to set the environment deploying to as environment variable and make it available to other below jobs
    - cat $devaccount >> build.env
    - cat $frontendacmdev >> build.env
    - source build.env
    - cat devops/vars/${Environment}.env >> build.env #set the environment specific variables/parameters
  artifacts:
    paths:
      - build.env
  tags:
    - docker

sonar:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:4.5
  rules:
    - if: $CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME =~ /^feature/ || $CI_COMMIT_REF_NAME =~ /^bugfix/
    - when: always
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: 0
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    #- export SONAR_SCANNER_OPTS="-Djavax.net.ssl.trustStore=cacerts/sonarca.jks -Djavax.net.ssl.trustStorePassword=changeit"
    #- sonar-scanner
    - apk upgrade --update-cache --available && apk add openssl && rm -rf /var/cache/apk/*
    - openssl s_client -connect  sonarqube:443 | keytool -import -noprompt -alias sonarqbue_test -keystore $JAVA_HOME/lib/security/cacerts -storepass changeit
    - sonar-scanner -X -Dsonar.branch.name=$CI_COMMIT_REF_NAME -Dsonar.projectKey=$CI_PROJECT_NAME

build:
  stage: build
  image: node:12
  dependencies:
    - initialize
    - dev_initialize
  script:
    - source build.env
    - yarn cache clean
    - yarn install
    - yarn build:$Environment
  artifacts:
    paths:
      - dist/   
  tags:
    - docker

deploystack:
  stage: deploystack
  rules:
    - if:  $CI_COMMIT_REF_NAME =~ /^feature/ || $CI_COMMIT_REF_NAME =~ /^bugfix/
      when: never 
    - if: '$DeployStack == "True"' #this flag drives whether to deploy the infrastructure stack
      when: always
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  dependencies:
    - initialize
    - dev_initialize
    - build
  script:
    - source build.env
    - aws cloudformation validate-template --template-body file://devops/cloudformation/cbex-unity-frontend-cf.yml --region $Region
    - aws cloudformation deploy --stack-name $Project-$Product-$Module-$Environment --template-file devops/cloudformation/cbex-unity-frontend-cf.yml --parameter-overrides $(cat devops/vars/cfparameters.ini) $(cat build.env) --tags $(cat devops/vars/cftags.ini) Environment=$Environment Lifecycle=$Environment --region $Region

deployartifacts:
  stage: deployartifacts
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  dependencies:
    - initialize
    - dev_initialize
    - build
  script:    
    - source build.env  
    - aws s3 sync dist/ s3://$BucketName/ --delete --region $Region
    - aws cloudfront create-invalidation --distribution-id $(aws cloudfront list-distributions --query "DistributionList.Items[?starts_with(AliasICPRecordals[0].CNAME, '$Route53Cname')].Id" --output text) --paths "/*" --region $Region
  tags:
    - docker
  when: manual
  only:
    - migration
    - dev
    - qa
    - uat
    - master
