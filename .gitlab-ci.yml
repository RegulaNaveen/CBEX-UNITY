# workflow:
#   rules:
#     - if: '$CI_PIPELINE_SOURCE != "merge_request_event"' # Disable pipeline for Merge requests

variables:
  RDS_DOMAIN: cbex
  RDS_TEST: "react-frontend"

include:
  - project: 'RDS-DevOps-COE/templates'
    ref: main
    file: 
      - ci/unittest-ci.yml    
      - ci/sonar-ci.yml
      - ci/gitleaks-ci.yml
      - ci/blackduck-ci.yml
      - utilities/email-notification.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push"
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"

stages:
  - unit_test
  - sonar_check
  - gitleaks
  - blackduck_scan
  - summary_notification
  - builddev
  - deploydev
  - builddev2
  - deploydev2
  - buildl4
  - deployl4
  - pafexecution_l4
  - buildqa
  - deployqa
  - pafexecution_svt
  - builddemo
  - deploydemo
  - builduat
  - deployuat
  - pafexecution_uat
  - buildprod
  - deployprod
  - pafexecution_prod
  - deploystack


dev:
  stage: builddev
  image: node:18
  variables:
    Environment: $CI_JOB_NAME
  rules:
    - if: $ENV=="dev"
    - if: '$CI_COMMIT_TAG'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - cat $devaccount >> build.env
    - cat $frontendacmdev >> build.env
    - cat devops/vars/${Environment}.env >> build.env
    - source build.env
    - npm cache clean --force
    - npm install --legacy-peer-deps
    - npm run build:$Environment
    - cp -r public/* dist/
  artifacts:
    paths:
      - dist/
      - build.env
  tags:
    - docker
  environment: dev

deploydev:
  stage: deploydev
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  needs:
    - dev
  # only:
  #   - dev
  #   - tags
  #   - pipelines
  rules:
    - if: $ENV=="dev"
    - if: '$CI_COMMIT_TAG'
    - if: $CI_PIPELINE_SOURCE == "pipelines"
  script:
    - aws --version
    - source build.env
    - aws s3 sync dist/ s3://$BucketName/ --delete --region $Region
    - aws cloudfront create-invalidation --distribution-id $(aws cloudfront list-distributions  --query "DistributionList.Items[?starts_with(to_string(AliasICPRecordals[0].CNAME), '$Route53Cname')].Id" --output text) --paths "/*" --region "us-east-1"
  tags:
    - docker
  environment: dev

