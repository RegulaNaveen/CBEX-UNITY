<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Unity</title>
    <script>

      // Call this as from React componentdidmount loadUbuildScript('dev', ()=>console.log('Ubuild script loaded'))
      const loadUbuildScript = (url, callback) => {
        const existingScript = document.getElementById('ubuild-script');
        if (!existingScript) {
          const script = document.createElement('script');
          script.src = `${url}`;
          script.id = 'ubuild-script';
          document.body.appendChild(script);
          script.onload = () => { 
            if (callback) callback();
          };
        }
        if (existingScript && callback) callback();
      };
    </script>
  </head>

  <body>
    <!-- We will insert the dom here -->
    <div id="root"></div>
  </body>
</html>
